name: Deploy Dev to Pages

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: write   # нужно для пуша в ветку gh-pages

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'

      - run: npm ci

      - name: Build with dev base
        run: npm run build
        env:
          VITE_BASE: /GoldHandAlina/dev/   # важный момент

      - name: Deploy to gh-pages (dev subfolder)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: dev   # ← ключевой параметр
          publish_branch: gh-pages
          force_orphan: false    # сохраняем существующую историю (main уже там)
